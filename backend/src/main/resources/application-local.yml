# 仅本地 Compose 开发环境；数据库密码由未入库的 .env / 环境变量提供。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MYSQL_DATABASE:group_photo}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:group_photo}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
