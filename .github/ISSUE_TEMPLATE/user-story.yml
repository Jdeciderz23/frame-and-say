name: 用户故事
description: 经真人调研后确认需求与验收标准
title: "[story] "
body:
  - type: textarea
    id: story
    attributes:
      label: 用户故事
      value: "作为……，我想……，以便……。\n需求状态：待访谈验证 / 已确认\n证据来源（匿名编号）："
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      value: "Given ……\nWhen ……\nThen ……\n异常与权限路径："
    validations:
      required: true
