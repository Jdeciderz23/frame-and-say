name: 用户故事
description: 记录公开资料、访谈或团队提案及其验收条件
title: "[story] "
body:
  - type: textarea
    id: story
    attributes:
      label: 用户故事
      value: "作为……，我想……，以便……。\n需求状态：候选 / 团队已评审 / 教师已确认\n证据来源（公开链接、匿名纪要或提案 Issue）："
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      value: "Given ……\nWhen ……\nThen ……\n异常与权限路径："
    validations:
      required: true
