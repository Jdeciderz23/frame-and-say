name: 开发任务
description: 前两周任务、调研、设计与工程工作
title: "[task] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 关联需求或计划中的任务编号；未确认的规则明确标注
    validations:
      required: true
  - type: markdown
    attributes:
      value: "请在右侧 Assignees 选择负责此任务的成员。分支和 PR 使用该 Issue 的 GitHub 编号。"
  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准与测试证据
      placeholder: "写出本任务可以核验的结果和验证方法。"
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: 前置依赖与接口影响
