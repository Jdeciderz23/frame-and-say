name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify
        working-directory: backend
  mysql-compose:
    name: mysql-compose
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      COMPOSE_PROJECT_NAME: frame-say-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./scripts/init-env.sh
      - name: Build and wait for MySQL and the HTTP services
        run: docker compose --profile app up -d --build --wait --wait-timeout 180
      - name: Validate the business API against MySQL via Nginx
        run: node --env-file=.env scripts/smoke-compose.mjs create "$RUNNER_TEMP/frame-say-smoke.json"
      - name: Validate photo upload limits and snapshot private files via Nginx
        run: node --env-file=.env scripts/smoke-photo-storage.mjs create "$RUNNER_TEMP/frame-say-photos.json" --compose
      - name: Verify reviewed delivery and consent revocation
        run: node --env-file=.env scripts/smoke-reviewed-export.mjs create "$RUNNER_TEMP/frame-say-export.json"
      - name: Verify approved deletion hides versions, updates progress and invalidates delivery
        run: node --env-file=.env scripts/smoke-photo-deletion.mjs create "$RUNNER_TEMP/frame-say-deletion.json"
      - name: Verify frontend stays available during a backend outage
        run: |
          docker compose --profile app stop backend
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5173/ --output /dev/null
          status=$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/api/health)
          echo "Health endpoint during backend outage: HTTP $status"
          test "$status" = 502 || test "$status" = 504
      - name: Restart MySQL and the backend and verify persistence
        run: |
          docker compose --profile app stop mysql
          docker compose --profile app up -d --wait --wait-timeout 150
          node --env-file=.env scripts/smoke-compose.mjs verify "$RUNNER_TEMP/frame-say-smoke.json"
          node --env-file=.env scripts/smoke-photo-storage.mjs verify "$RUNNER_TEMP/frame-say-photos.json" --compose
          node --env-file=.env scripts/smoke-reviewed-export.mjs verify "$RUNNER_TEMP/frame-say-export.json"
          node --env-file=.env scripts/smoke-photo-deletion.mjs verify "$RUNNER_TEMP/frame-say-deletion.json"
      - if: failure()
        run: docker compose --profile app logs --no-color --tail 80
      - if: always()
        run: docker compose --profile app down -v
