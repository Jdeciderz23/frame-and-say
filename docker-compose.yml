name: group-photo-consensus
services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-group_photo}
      MYSQL_USER: ${MYSQL_USER:-group_photo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-group_photo}
      MYSQL_USER: ${MYSQL_USER:-group_photo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.sh first}
      APP_BOOTSTRAP_ORGANIZER_TOKEN: ${APP_BOOTSTRAP_ORGANIZER_TOKEN:-}
      APP_BOOTSTRAP_PARTICIPANT_TOKEN: ${APP_BOOTSTRAP_PARTICIPANT_TOKEN:-}
      APP_PHOTO_DIR: /app/data/photos
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - photo-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  mysql-data:
  photo-data:
