openapi: 3.0.3
info:
  title: 合照都满意 - 启动阶段接口草案
  version: startup-draft
  description: >-
    当前仅/api/health为基础工程实现契约，需以实际测试记录为准。
    x-implementation-status为planned的业务接口尚未实现，仅用于前两周并行开发讨论。
    身份方案、授权用途和偏好档位待确认；Bearer方案仅占位，不表示已经实现登录。
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 应用存活检查，不代表MySQL或存储服务已连通
      x-implementation-status: implemented-scaffold
      security: []
      responses:
        '200':
          description: 应用可响应
          content:
            application/json:
              schema:
                type: object
                required: [status, application]
                properties:
                  status:
                    type: string
                    enum: [UP]
                  application:
                    type: string
                    enum: [group-photo-consensus]
  /api/events:
    post:
      operationId: createEvent
      summary: 创建活动；创建者来自服务端认证上下文
      x-implementation-status: planned
      x-task-id: W2-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                desiredPhotoCount:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    get:
      operationId: listMyEvents
      summary: 列出当前用户已加入的活动
      x-implementation-status: planned
      x-task-id: W2-01
      responses:
        '200':
          description: 当前用户可访问的活动，空数组合法
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/events/{eventId}/members:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listEventMembers
      summary: 查询活动成员；必须先校验当前用户属于活动
      x-implementation-status: planned
      x-task-id: W2-03
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [userId, displayName, role]
                  properties:
                    userId:
                      type: string
                    displayName:
                      type: string
                    role:
                      type: string
                      enum: [ORGANIZER, PARTICIPANT]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/events/{eventId}/photos:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: uploadPhoto
      summary: 上传一张照片；校验成员权限和真实文件内容
      x-implementation-status: planned
      x-task-id: W2-05
      description: JPEG/PNG；文件大小和像素上限待评审。服务端生成对象键，不接受客户端路径。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 图片及版本元数据；实际访问需权限检查，不返回公共桶地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 文件过大
        '415':
          description: 非支持或无法解码的图片类型
  /api/events/{eventId}/photos/{photoId}/preferences/me:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
    put:
      operationId: setMyPreference
      summary: 更新本人偏好；不产生任何发布授权
      x-implementation-status: planned
      x-task-id: W2-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photoVersionId, value]
              properties:
                photoVersionId:
                  type: string
                value:
                  type: integer
                  enum: [-1, 0, 1]
                  description: 暂定不喜欢/一般/喜欢；未评分不等于0，缺省规则待确认
      responses:
        '204':
          description: 本人偏好已保存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/events/{eventId}/photos/{photoId}/consents/me:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
    put:
      operationId: setMyPublicationConsent
      summary: 对精确图片版本和用途记录本人发布决定
      x-implementation-status: planned
      x-task-id: W2-03
      description: 策略和模型是第二周重点；完整接口落地取决于授权语义评审，不允许代签。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photoVersionId, purpose, decision]
              properties:
                photoVersionId:
                  type: string
                purpose:
                  $ref: '#/components/schemas/Purpose'
                decision:
                  type: string
                  enum: [ALLOW, DENY]
      responses:
        '204':
          description: 本人决定已保存；未确认由服务端保持PENDING，不得自动同意
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/events/{eventId}/selections:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: selectPhotos
      summary: 申请选片；评分和授权由服务端读取，不信任前端eligible字段
      x-implementation-status: planned
      x-task-id: W2-04
      description: 第二周先验收纯Java模拟数据算法；薄接口仅在依赖具备后连接，未接通时明确未实现。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count, purpose]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                purpose:
                  $ref: '#/components/schemas/Purpose'
      responses:
        '200':
          description: 候选不足也返回实际结果和原因，绝不放宽授权；结果不是发布许可
          content:
            application/json:
              schema:
                type: object
                required: [selectedPhotoVersionIds, requestedCount, complete, reasons]
                properties:
                  selectedPhotoVersionIds:
                    type: array
                    items:
                      type: string
                  requestedCount:
                    type: integer
                  complete:
                    type: boolean
                  reasons:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 身份方案占位，待团队确认；不能凭此认定已实现认证
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Event:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        desiredPhotoCount:
          type: integer
          minimum: 1
          maximum: 100
    PhotoMetadata:
      type: object
      required: [photoId, photoVersionId, eventId, thumbnailAvailable]
      properties:
        photoId:
          type: string
        photoVersionId:
          type: string
        eventId:
          type: string
        thumbnailAvailable:
          type: boolean
    Purpose:
      type: string
      enum: [INTERNAL_SHARE, PUBLIC_POST]
      description: 暂定用途，待访谈确认；不同用途不得自动继承许可
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    BadRequest:
      description: 参数或文件不合法
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 未识别有效身份
    Forbidden:
      description: 无访问或操作权限；不能跨活动访问或替别人授权
    Conflict:
      description: 图片版本、出镜集合或其他状态发生变化，需刷新并重新确认
