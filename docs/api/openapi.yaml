openapi: 3.0.3
info:
  title: 照有商量 · Frame & Say
  version: team-baseline
  description: >-
    已实现的接口用于团队联调。标记为 planned 的选片接口用于设计评审。
    Bearer 联调用身份由本机配置提供，正式登录和邀请流程单独开发。
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: 检查应用存活
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: 应用可响应
          content:
            application/json:
              schema:
                type: object
                required: [status, application]
                properties:
                  status:
                    type: string
                    enum: [UP]
                  application:
                    type: string
                    enum: [group-photo-consensus]
  /api/events:
    post:
      operationId: createEvent
      summary: 创建活动并将调用者设为该活动的发起人
      x-implementation-status: implemented
      x-task-id: W2-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: 名称不能全为空白
                desiredPhotoCount:
                  $ref: '#/components/schemas/PhotoCount'
      responses:
        '201':
          description: 活动及其发起人成员关系创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    get:
      operationId: listMyEvents
      summary: 列出当前用户已加入的活动
      x-implementation-status: implemented
      x-task-id: W2-01
      responses:
        '200':
          description: 当前用户可访问的活动，允许空数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/events/{eventId}/members:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listEventMembers
      summary: 查询当前用户所在活动的成员
      x-implementation-status: implemented
      x-task-id: W2-03
      responses:
        '200':
          description: 该活动的成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addEventMember
      summary: 发起人添加已配置的联调成员
      x-implementation-status: implemented
      x-task-id: W2-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: participant
                  description: 拟添加的已有身份
      responses:
        '204':
          description: 成员已加入，重复请求保留原成员关系
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/events/{eventId}/photos:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listEventPhotos
      summary: 列出成员可访问的活动照片
      description: 每张照片只列出当前最新版本。已存在的历史版本可通过其受保护的缩略图路径读取。
      x-implementation-status: implemented
      x-task-id: W2-05
      responses:
        '200':
          description: 活动照片及版本信息
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoMetadata'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: uploadPhoto
      summary: 上传一张照片
      description: >-
        JPEG 或 PNG，以服务端识别并实际解码的内容为准，不信任文件扩展名或上传声明的 Content-Type。
        空文件返回 400，伪装文本、其他图片格式或无法解码的图片返回 415。
        文件上限 8 MiB，请求体上限 9 MiB，单边至多 12000 像素，总像素至多 2400 万；超限返回 413。
        原文件名不参与存储键生成；每次成功上传生成独立版本，响应仅提供受成员权限保护的缩略图路径。
      x-implementation-status: implemented
      x-task-id: W2-05
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 照片及版本创建，初始出镜名单未确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: >-
            文件、图片尺寸或整个 multipart 请求体超出限制。请求体包含分隔符和表单字段。
            Nginx 可在身份检查前拒绝超限请求，错误正文可能与应用不同。
        '409':
          description: 此活动已有 100 张照片
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          $ref: '#/components/responses/UnsupportedImage'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/events/{eventId}/photos/{photoId}/versions/{photoVersionId}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
      - $ref: '#/components/parameters/PhotoVersionPath'
    get:
      operationId: getPhotoThumbnail
      summary: 成员读取指定版本的缩略图
      description: >-
        活动、照片和版本必须匹配。有效成员可读取指定版本，包括仍保留的历史版本。
        缩略图使用 PNG，返回 Cache-Control no-store。
        请求仅接收资源标识，响应不提供原图 URL 或磁盘路径。
      x-implementation-status: implemented
      x-task-id: W2-05
      responses:
        '200':
          description: 私有缩略图，最长边不大于 320 像素且原图较小时不放大
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/events/{eventId}/photos/{photoId}/versions/{photoVersionId}/subjects:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
      - $ref: '#/components/parameters/PhotoVersionPath'
    get:
      operationId: getPhotoSubjects
      summary: 发起人读取指定版本的出镜名单
      x-implementation-status: implemented
      x-task-id: W2-03
      responses:
        '200':
          description: 当前名单及修订号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoSubjects'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: confirmPhotoSubjects
      summary: 发起人确认或更新指定版本的出镜名单
      description: >-
        subjectRevision 必须是当前修订。userIds 仅包含本活动成员。
        首次确认会递增修订号，允许明确确认空名单。重复提交已确认的相同集合保留修订号。
      x-implementation-status: implemented
      x-task-id: W2-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subjectRevision, userIds]
              properties:
                subjectRevision:
                  $ref: '#/components/schemas/SubjectRevision'
                userIds:
                  type: array
                  uniqueItems: true
                  maxItems: 10
                  items:
                    type: string
                  example: [participant]
      responses:
        '200':
          description: 当前版本与名单修订状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/events/{eventId}/photos/{photoId}/preferences/me:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
    get:
      operationId: getMyPreference
      summary: 查询本人对指定版本的偏好
      parameters:
        - $ref: '#/components/parameters/PhotoVersionQuery'
      x-implementation-status: implemented
      x-task-id: W2-02
      responses:
        '200':
          description: 当前值，未评分时 value 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: setMyPreference
      summary: 更新本人对指定版本的偏好
      x-implementation-status: implemented
      x-task-id: W2-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photoVersionId, value]
              properties:
                photoVersionId:
                  type: string
                  format: uuid
                value:
                  type: integer
                  enum: [-1, 0, 1]
      responses:
        '204':
          description: 本人偏好已保存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/events/{eventId}/photos/{photoId}/consents/me:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PhotoId'
    get:
      operationId: getMyPublicationConsent
      summary: 查询当前名单修订下的本人授权状态
      description: >-
        仅返回当前操作者本人的状态；canDecide=false 时不得提交。
        若版本已过期返回 409，先重新读取活动照片列表取得当前版本，再读取本人状态。
      parameters:
        - $ref: '#/components/parameters/PhotoVersionQuery'
        - name: purpose
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Purpose'
      x-implementation-status: implemented
      x-task-id: W2-03
      responses:
        '200':
          description: 当前修订、授权状态及本人是否可以确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      operationId: setMyPublicationConsent
      summary: 对指定版本、出镜名单修订和用途提交本人决定
      description: >-
        只有已确认名单中的本人可提交。名单或照片版本过期返回 409。
        调用方应清除待提交选择，重新读取照片列表和本人状态，由本人查看当前版本后再次确认；不得自动重放旧同意。
        普通出镜者刷新本人状态不需要、也无权读取发起人专用的出镜名单接口。
      x-implementation-status: implemented
      x-task-id: W2-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [photoVersionId, subjectRevision, purpose, decision]
              properties:
                photoVersionId:
                  type: string
                  format: uuid
                subjectRevision:
                  $ref: '#/components/schemas/SubjectRevision'
                purpose:
                  $ref: '#/components/schemas/Purpose'
                decision:
                  type: string
                  enum: [ALLOW, DENY]
      responses:
        '204':
          description: 本人决定已保存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/events/{eventId}/selections:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: selectPhotos
      summary: 申请选片并返回结构化解释
      description: >-
        草案。应用从服务端读取偏好和当前授权，先排除不合格候选，再运行算法。
        返回汇总原因和效用，不暴露个人授权决定。
      x-implementation-status: planned
      x-task-id: W2-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count, purpose]
              properties:
                count:
                  $ref: '#/components/schemas/PhotoCount'
                purpose:
                  $ref: '#/components/schemas/Purpose'
      responses:
        '200':
          description: 返回实际可选结果和汇总解释。文件交付仍需复核授权。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 联调令牌由服务端分别配置；仅在 demo/local/test 且 app.bootstrap.enabled=true 时可用，其他环境不接受演示身份。
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoVersionPath:
      name: photoVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoVersionQuery:
      name: photoVersionId
      in: query
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PhotoCount:
      type: integer
      minimum: 1
      maximum: 100
    SubjectRevision:
      type: integer
      minimum: 0
    Event:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        desiredPhotoCount:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
    EventMember:
      type: object
      required: [userId, displayName, role]
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [ORGANIZER, PARTICIPANT]
    PhotoMetadata:
      type: object
      additionalProperties: false
      description: 不包含原文件名、磁盘路径或原图下载地址；photoVersionId 是版本标识，不是访问凭据。
      required: [photoId, photoVersionId, eventId, thumbnailAvailable, thumbnailUrl, subjectRevision, rosterConfirmed]
      properties:
        photoId:
          type: string
          format: uuid
        photoVersionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        thumbnailAvailable:
          type: boolean
        thumbnailUrl:
          type: string
          description: 同源受保护 API 路径，读取时携带当前活动成员令牌；返回最长边不超过 320 像素且不放大的 PNG，Cache-Control 为 no-store
        subjectRevision:
          $ref: '#/components/schemas/SubjectRevision'
        rosterConfirmed:
          type: boolean
    Preference:
      type: object
      required: [photoVersionId, value]
      properties:
        photoVersionId:
          type: string
          format: uuid
        value:
          type: integer
          nullable: true
          enum: [-1, 0, 1, null]
          description: 未评分为 null，0 表示一般
    PhotoSubjects:
      type: object
      required: [photoVersionId, subjectRevision, rosterConfirmed, userIds]
      properties:
        photoVersionId:
          type: string
          format: uuid
        subjectRevision:
          $ref: '#/components/schemas/SubjectRevision'
        rosterConfirmed:
          type: boolean
        userIds:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            type: string
    Purpose:
      type: string
      enum: [INTERNAL_SHARE, PUBLIC_POST]
      description: 授权用途，两个用途分别确认
    Consent:
      type: object
      required: [photoVersionId, subjectRevision, purpose, decision, canDecide]
      properties:
        photoVersionId:
          type: string
          format: uuid
        subjectRevision:
          $ref: '#/components/schemas/SubjectRevision'
        purpose:
          $ref: '#/components/schemas/Purpose'
        decision:
          type: string
          enum: [PENDING, ALLOW, DENY]
        canDecide:
          type: boolean
    Selection:
      type: object
      required: [purpose, selectedPhotoVersionIds, requestedCount, complete, reasons, metrics]
      properties:
        purpose:
          $ref: '#/components/schemas/Purpose'
        selectedPhotoVersionIds:
          type: array
          items:
            type: string
            format: uuid
        requestedCount:
          $ref: '#/components/schemas/PhotoCount'
        complete:
          type: boolean
        reasons:
          type: array
          items:
            type: object
            required: [code, photoCount]
            properties:
              code:
                type: string
                enum: [ROSTER_UNCONFIRMED, AUTHORIZATION_REQUIRED, INSUFFICIENT_CANDIDATES]
              photoCount:
                type: integer
                minimum: 0
        metrics:
          type: object
          properties:
            eligiblePhotoCount:
              type: integer
              minimum: 0
            minimumMemberUtility:
              type: number
            totalMemberUtility:
              type: number
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    BadRequest:
      description: 参数、名单或文件信息不合法
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 身份缺失或令牌无效
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 当前用户缺少可核实的活动成员关系、角色或本人确认资格
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在或资源与路径上下文不匹配
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 照片版本、出镜名单修订或其他相关状态已经变化
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedImage:
      description: 不支持或无法解码的 JPEG/PNG
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageUnavailable:
      description: 服务端私有存储暂不可用
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
