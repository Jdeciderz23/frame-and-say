upstream frame_backend {
    zone frame_backend 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        client_max_body_size 9m;
        error_page 413 = @request_too_large;
        proxy_pass http://frame_backend;
        proxy_set_header Host $host;
    }
    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
